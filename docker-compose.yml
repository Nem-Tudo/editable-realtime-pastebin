services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - codepaste

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/codepaste
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "55018:4000"
    depends_on:
      - mongo
    networks:
      - codepaste

  web:
    build: ./web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: http://api:4000
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
    ports:
      - "55017:3000"
    depends_on:
      - api
    networks:
      - codepaste

volumes:
  mongo_data:

networks:
  codepaste:
